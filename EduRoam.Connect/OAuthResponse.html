<!DOCTYPE html>
<html lang="en" class="dialog">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html {
	background: #f6f4f2;
	color: #212529;
	font-family: sans-serif;
	line-height: 1.15;
	-webkit-text-size-adjust: 100%;
	-webkit-tap-highlight-color: rgba(0, 0, 0, 0);
	margin: 0;
	padding: 0;
}
body:before {
	display: block;
	background-image: url("{4}");
	background-repeat: no-repeat;
	background-position: 50% 50%;
	background-size: contain;
	content: ' ';
	width: 100%;
	height: 10vw;
	max-height: 4em;
}
body {
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
	font-weight: 400;
	line-height: 1.5;
	text-align: left;
	margin: 1em;
}
html main, html header {
	margin: 1em auto;
}
html header {
	max-width: 62em;
}
html.dialog main {
	max-width: 24em;
}
main {
	display: block;
	border-top: solid .4em;
	border-color: #276cba;
	padding: 1em;
	background: white;
	border-radius: .3em;
	box-shadow: rgba(0,0,0,.1) 0 .1em .3em;
	min-height: 17em;
}
p {
	font-size: .95em;
}
p.text-center {
	text-align: center
}

body{
	display: grid;
	grid-template-columns: 1fr;
}
html main {
	margin: 0 auto;
	width: initial;
}


@media (prefers-color-scheme: dark) {
	html {
		color: #f5f4f2;
		background: #111519;
	}
	body:before {
		background-image: url("{5}");
	}
	main {
		background: #212529;
		color: #f5f4f2;
		box-shadow: rgba(0,0,0,.5) 0 .1em .5em;
		border-color: #008fa7;
	}
	hr {
		border-color: #313539;
	}
	nav li a:hover, nav li a:focus {
		background: rgba(255,255,255,.05);
		color: #206eb0;
	}
	nav li.active a, nav li a:active {
		background: #007fa7;
		color: white;
	}
	nav li a {
		color: #b1d0de;
	}
}


@media (min-width: 800px) {
	body{
		grid-template-columns: 10em auto 10em;
		column-gap: 1.5em;
		max-width: 80em;
		margin: 0 auto;
	}
	html.dialog body {
		grid-template-columns: 1fr;
		column-gap: 0;
	}
	html header {
		max-width: 38rem;
		width: 100%;
	}
	body:before{
		margin-bottom: 2em;
	}
	body:before,header{
		grid-column: 1/4;
	}
}
</style>
<title>{0} - {1}</title>

<div>
<main>
	<p class="text-center">
	<strong>{2}</strong>

	<p class="text-center">
		{3}
</main>
</div>
